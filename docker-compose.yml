services:
  postgres:
    image: postgres:17-alpine
    container_name: gigahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gigahub
      POSTGRES_PASSWORD: gigahub
      POSTGRES_DB: gigahub_os
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U gigahub -d gigahub_os
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: gigahub-redis
    restart: unless-stopped
    profiles:
      - queue
    command:
      - redis-server
      - --appendonly
      - 'yes'
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
