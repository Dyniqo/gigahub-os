name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://gigahub:gigahub@localhost:5432/gigahub_os?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-change-before-production
      JWT_REFRESH_SECRET: ci-refresh-secret-change-before-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
