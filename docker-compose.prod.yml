x-database-url: &database-url postgresql://gigahub:${POSTGRES_PASSWORD}@postgres:5432/gigahub_os?schema=public

x-app-environment: &app-environment
  NODE_ENV: production
  APP_NAME: ${APP_NAME:-GigaHub OS}
  DATABASE_URL: *database-url
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gigahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gigahub_os
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gigahub -d gigahub_os']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ghcr.io/dyniqo/gigahub-migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/dyniqo/gigahub-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-environment
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      API_PREFIX: ${API_PREFIX:-api}
      API_VERSION: ${API_VERSION:-1}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    ports:
      - '127.0.0.1:${API_PORT:-13000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const p=process.env.API_PREFIX||'api';const v=process.env.API_VERSION||'1';fetch('http://127.0.0.1:3000/'+p+'/v'+v+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: ghcr.io/dyniqo/gigahub-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/dyniqo/gigahub-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-18080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
